services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: supportpulse-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./data/supportpulse.db
      - MODELS_DIR=./models
      - SECRET_KEY=supportpulse-production-compose-key-change-me
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportpulse-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
